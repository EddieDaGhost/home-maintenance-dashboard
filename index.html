<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="A low-friction home maintenance and cleaning tracker with NFC tag shortcuts." />

    <!-- Lets the app be added to the iPhone home screen and open without Safari chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Home" />

    <!--
      iOS does not read the web manifest for Add to Home Screen, and it will not
      take an SVG. Without this one link it puts a SCREENSHOT OF THE PAGE on the
      home screen — on the app whose whole pitch is "add it to your home screen
      and tap the stickers". Generated by scripts/make-icons.mjs.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <title>Home Maintenance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
